services:

  service:
    build:
      context: .
      target: start
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1G
      - /usr/local/lib/node_modules/.cache:nosuid,size=500M
    user: "node"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 512
          cpus: 2
          memory: 4G
    networks:
      - ai_net
    depends_on:
      - outbounds_proxy
    volumes:
      - ./.dsh:/home/node/.dsh:rw   # Data directory
      - ${HOME1}/global_agent_workspace:/home/node/global_agent_workspace:rw
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HTTP_PROXY=http://outbounds_proxy:3128
      - HTTPS_PROXY=http://outbounds_proxy:3128
      - NO_PROXY=localhost,127.0.0.1

  inbounds_proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3080:80"
    volumes:
      - ./inbounds/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ai_net
      - external_net
    depends_on:
      - service

  outbounds_proxy:
    image: sameersbn/squid:latest
    volumes:
      - ./outbounds/squid.conf:/root/squid.conf:ro
      - ./outbounds/entrypoint.sh:/root/entrypoint.sh:ro
    tmpfs:
      - /etc/squid:noexec,nosuid,size=1M
    command: ["sh", "/root/entrypoint.sh"]
    networks:
      - ai_net
      - external_net

networks:
  ai_net:
    # Agent has NO direct internet
    internal: true
  external_net:
    # Default bridge - proxy can reach the internet
    driver: 'bridge'
