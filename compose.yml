include:
  - ./srv_agent/derived/workspace_binds.yml

services:

  srv_agent:
    restart: unless-stopped
    build:
      context: srv_agent
      target: start
    read_only: true
    user: "node"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 512
          cpus: 2
          memory: 4G
    networks:
      - ai_net
    dns:
      # PinchTab's navigation preflight resolves hostnames itself; ai_net is
      # internal, so point it at the forwarding resolver on ai_net.
      - 172.16.0.53
    depends_on:
      - srv_outbounds
      - srv_dns
    volumes:
      # Data directory (chown 1000 and chmod 0700 in docker WSL distro first)
      - ./persist/srv_agent/.dsh:/home/node/.dsh:rw
      - ./persist/srv_agent/.pinchtab:/home/node/.pinchtab:rw
      - ./persist/srv_agent/.config:/home/node/.config:rw
      - ./persist/srv_agent/.local:/home/node/.local:rw
      - ./persist/srv_agent/.cache:/home/node/.cache:rw
    tmpfs:
      - /tmp:noexec,nosuid,size=1G
      - /usr/local/lib/node_modules/.cache:nosuid,size=500M
    environment:
      - DSH_EXTRA_ARGS=${DSH_EXTRA_ARGS}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HTTP_PROXY=http://srv_outbounds:3128
      - http_proxy=http://srv_outbounds:3128
      - HTTPS_PROXY=http://srv_outbounds:3128
      - https_proxy=http://srv_outbounds:3128
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - TZ=Asia/Shanghai

  srv_inbounds:
    restart: unless-stopped
    image: nginx:1.31.6-alpine3.24-slim
    ports:
      - "127.0.0.1:3080:80"
      - "127.0.0.1:3082:82"
    volumes:
      - ./srv_inbounds/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ai_net
      - external_net
    depends_on:
      - srv_agent

  srv_outbounds:
    restart: unless-stopped
    image: sameersbn/squid:3.5.27-2
    volumes:
      - ./srv_outbounds/squid.conf:/root/squid.conf:ro
      - ./srv_outbounds/squid-extra:/etc/squid-extra:ro
      - ./srv_outbounds/entrypoint.sh:/root/entrypoint.sh:ro
    tmpfs:
      - /etc/squid:noexec,nosuid,size=1M
    command: ["sh", "/root/entrypoint.sh"]
    networks:
      ai_net:
        # Fixed address so pinchtab can accurately trust this proxy address.
        ipv4_address: 172.16.0.80
      external_net: {}

  srv_dns:
    restart: unless-stopped
    image: coredns/coredns:1.14.7
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./srv_dns/Corefile:/etc/coredns/Corefile:ro
    networks:
      ai_net:
        # Fixed address so srv_agent can name it in `dns:` (Docker's dns
        # option takes an address, not a service name).
        ipv4_address: 172.16.0.53
      external_net: {}

networks:
  ai_net:
    # Agent has NO direct internet
    internal: true
    ipam:
      config:
        # Pinned so srv_dns gets a predictable address on the internal net.
        - subnet: 172.16.0.0/24
  external_net:
    # Default bridge - proxy can reach the internet
    driver: 'bridge'
