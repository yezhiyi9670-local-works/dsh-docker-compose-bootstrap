services:

  agent:
    build:
      context: agent
      target: start
    read_only: true
    user: "node"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 512
          cpus: 2
          memory: 4G
    networks:
      - ai_net
    depends_on:
      - outbounds
    volumes:
      # Data directory (chown 1000 and chmod 0700 in docker WSL distro first)
      - ./persist/agent/.dsh:/home/node/.dsh:rw
      - ./persist/agent/.pinchtab:/home/node/.pinchtab:rw
      - ./persist/agent/.config:/home/node/.config:rw
      - ./persist/agent/.local:/home/node/.local:rw
      - ./persist/agent/.cache:/home/node/.cache:rw
      - ${HOME1}/global_agent_workspace:/home/node/global_agent_workspace:rw
    tmpfs:
      - /tmp:noexec,nosuid,size=1G
      - /usr/local/lib/node_modules/.cache:nosuid,size=500M
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HTTP_PROXY=http://outbounds:3128
      - HTTPS_PROXY=http://outbounds:3128
      - NO_PROXY=localhost,127.0.0.1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

  inbounds:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3080:80"
      - "127.0.0.1:3082:82"
    volumes:
      - ./inbounds/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ai_net
      - external_net
    depends_on:
      - agent

  outbounds:
    image: sameersbn/squid:latest
    volumes:
      - ./outbounds/squid.conf:/root/squid.conf:ro
      - ./outbounds/entrypoint.sh:/root/entrypoint.sh:ro
    tmpfs:
      - /etc/squid:noexec,nosuid,size=1M
    command: ["sh", "/root/entrypoint.sh"]
    networks:
      - ai_net
      - external_net

networks:
  ai_net:
    # Agent has NO direct internet
    internal: true
  external_net:
    # Default bridge - proxy can reach the internet
    driver: 'bridge'
