services:

  srv_agent:
    restart: unless-stopped
    build:
      context: srv_agent
      target: start
    read_only: true
    user: "node"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      - no-new-privileges:true
      # Prevent SELinux denial without changing host-side context
      # (which may break host-side workflow)
      - label:disable
    # Map host user to this UID, eliminating ownership problems
    userns_mode: keep-id:uid=1000,gid=1000
    deploy:
      resources:
        limits:
          pids: 768
          cpus: 3
          memory: 6G
    networks:
      - ai_net
    depends_on:
      - srv_outbounds
      - srv_dns
    # All persist and workspace mounts into srv_agent are now defined in MountHouse DSL. See `mounthouse/`.
    volumes:
      - ./srv_agent/resolv.conf:/etc/resolv.conf:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=1G
      - /usr/local/lib/node_modules/.cache:nosuid,size=500M
    env_file:
      - ./srv_agent/.env
    environment:
      - DSH_EXTRA_ARGS=${DSH_EXTRA_ARGS:-}
      - HTTP_PROXY=http://srv_outbounds:3128
      - http_proxy=http://srv_outbounds:3128
      - HTTPS_PROXY=http://srv_outbounds:3128
      - https_proxy=http://srv_outbounds:3128
      - NO_PROXY=localhost,127.0.0.1,::1
      - no_proxy=localhost,127.0.0.1,::1
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - TZ=Asia/Shanghai

  srv_inbounds:
    restart: unless-stopped
    image: docker.io/nginx:1.31.6-alpine3.24-slim
    security_opt:
      - label:disable
    ports:
      - "127.0.0.1:${DSH_EXPOSE_PORT:-3080}:80"
      - "[::1]:${DSH_EXPOSE_PORT:-3080}:80"
      - "127.0.0.1:${PINCHTAB_EXPOSE_PORT:-3082}:82"
      - "[::1]:${PINCHTAB_EXPOSE_PORT:-3082}:82"
    volumes:
      - ./srv_inbounds/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./srv_inbounds/bad_gateway.conf:/etc/nginx/bad_gateway.conf:ro
    networks:
      - ai_net
      - external_net
    depends_on:
      - srv_agent

  srv_outbounds:
    restart: unless-stopped
    image: docker.io/sameersbn/squid:3.5.27-2
    security_opt:
      - label:disable
    volumes:
      - ./srv_outbounds/squid.conf:/root/squid.conf:ro
      - ./srv_outbounds/squid-extra:/etc/squid-extra:ro
      - ./srv_outbounds/entrypoint.sh:/root/entrypoint.sh:ro
    tmpfs:
      - /etc/squid:noexec,nosuid,size=1M
    command: ["sh", "/root/entrypoint.sh"]
    networks:
      ai_net:
        # Fixed address so pinchtab can be accurately configured to trust this proxy address.
        ipv4_address: 172.30.80.80
        ipv6_address: fd00:9:30:80::80
      external_net: {}

  srv_dns:
    restart: unless-stopped
    image: docker.io/coredns/coredns:1.14.7
    command: ["-conf", "/etc/coredns/Corefile"]
    security_opt:
      - label:disable
    volumes:
      - ./srv_dns/Corefile:/etc/coredns/Corefile:ro
    networks:
      ai_net:
        # Fixed address so srv_agent can name it in `dns:` (Docker's dns
        # option takes an address, not a service name).
        ipv4_address: 172.30.80.53
        ipv6_address: fd00:9:30:80::53
      external_net: {}

networks:
  ai_net:
    # Agent has NO direct internet
    internal: true
    enable_ipv6: true
    ipam:
      config:
        # Pinned so srv_dns gets a predictable address on the internal net.
        - subnet: 172.30.80.0/24
          gateway: 172.30.80.1
        - subnet: fd00:9:30:80::/64
          gateway: fd00:9:30:80::1
  external_net:
    # Default bridge - proxy can reach the internet
    driver: 'bridge'
    enable_ipv6: true
