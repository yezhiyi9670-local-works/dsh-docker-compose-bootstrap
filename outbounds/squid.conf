# =============================================================================
# Squid Configuration for DeepSeek Harness Sandbox
# =============================================================================

# --- Basic Settings ---
http_port 3128

# --- Port ACLs ---
acl HTTPS_ports port 443
acl HTTP_maybe_S_ports port 80 443
acl Host_extra_ports port 11320  # openai human mock server

# --- Destination ACLs ---

# LAN IP ranges (private networks)
acl LocalTarget dst 0.0.0.1-0.255.255.255  # RFC 1122 "this" network (LAN)
acl LocalTarget dst 10.0.0.0/8             # RFC 1918 local private network (LAN)
acl LocalTarget dst 169.254.0.0/16         # RFC 3927 link-local (directly plugged) machines
acl LocalTarget dst 172.16.0.0/12          # RFC 1918 local private network (LAN)
acl LocalTarget dst 192.168.0.0/16         # RFC 1918 local private network (LAN)
acl LocalTarget dst fc00::/7               # RFC 4193 local private network range
acl LocalTarget dst fe80::/10              # RFC 4291 link-local (directly plugged) machines

# Example: host.docker.internal IP (auto-replaced by script)
# FIXME: Is the IP resolved by entrypoint.sh the only one?
acl HostDockerInternal dst HOST_DOCKER_INTERNAL_IP

# Blocked domains
acl BlockedExternalDomain dstdomain .example.org

# --- Access Rules (Order Matters: First Match Wins) ---

http_access allow HTTPS_ports !LocalTarget !BlockedExternalDomain

http_access allow HTTP_maybe_S_ports LocalTarget

http_access allow Host_extra_ports HostDockerInternal

http_access deny all
